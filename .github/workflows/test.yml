name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: cp example.env .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker compose --profile test build \
            --build-arg BUILDKIT_INLINE_CACHE=1

      - name: Run tests
        run: |
          docker compose --profile test up --abort-on-container-exit --exit-code-from java-test

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p test-reports
          cp -r app/build/reports test-reports/ 2>/dev/null || true
          cp -r app/build/test-results test-reports/ 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-reports/

      - name: Cleanup
        if: always()
        run: docker compose --profile test down -v

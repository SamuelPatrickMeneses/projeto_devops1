services: 
  java-build:
    profiles:
      - "prod"
    build:
      context: .
      dockerfile: ./devserver/Dockerfile
    volumes:
      - ./app/src:/home/ubuntu/app/src
      - ./app/build.gradle:/home/ubuntu/app/build.gradle
      - ./app/build:/home/ubuntu/app/build
      - ./server/server.xml:/home/ubuntu/server/server.xml
    command: ["./gradlew", ":app:build", "--no-daemon", "--gradle-user-home", "/home/ubuntu/.gradle-home", "-x", "test"]

  java:
    profiles:
      - "prod"
    build:
      context: .
      dockerfile: ./server/Dockerfile
    volumes:
      - "./app/build/libs/app.war:/config/apps/app.war"
      - "./server/server.xml:/config/server.xml"
      - "./.env:/config/server.env"
      - "./server/postgresql-42.7.3.jar:/config/lib/postgresql-42.7.3.jar"
    depends_on:
      db:
        condition: service_healthy
      java-build:
        condition: service_completed_successfully
    networks: 
      - internal

  java-dev:
    profiles:
      - "dev"
      - "test"
    build:
      context: .
      dockerfile: ./devserver/Dockerfile
    volumes:
      - ./app/src:/home/ubuntu/app/src
      - ./app/build.gradle:/home/ubuntu/app/build.gradle
      - ./server/server.xml:/home/ubuntu/server/server.xml
    depends_on:
      db:
        condition: service_healthy
      selenium-chrome:
        condition: service_started
    networks: 
      - internal
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q :8080"]
      interval: 10s     
      timeout: 3s      
      retries: 15      
      start_period: 10s


  java-test:
    profiles:
      - "test"
    build:
      context: .
      dockerfile: ./devserver/Dockerfile
    volumes:
      - ./app/src:/home/ubuntu/app/src
      - ./app/build.gradle:/home/ubuntu/app/build.gradle
      - ./server/server.xml:/home/ubuntu/server/server.xml
    depends_on:
      db:
        condition: service_healthy
      selenium-chrome:
        condition: service_started
      nginx-dev:
        condition: service_healthy
      java-dev:
        condition: service_healthy 
    networks:      
      - internal
    command: ["./gradlew", ":app:test", "--no-daemon", "--gradle-user-home", "/home/ubuntu/.gradle-home"]

  db:
    image: postgres:latest
    profiles:
      - "dev"
      - "test"
      - "prod"
    env_file: "./.env"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks: 
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  nginx-prod:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    profiles:
      - "prod"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/prod/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      java:
        condition: service_started
    networks: 
      - internal

  nginx-dev:
    profiles:
      - "dev"
      - "test"
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/dev/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    networks: 
      - internal
    depends_on:
      java-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q :80"]
      interval: 10s     
      timeout: 3s      
      retries: 15      
      start_period: 10s


  selenium-chrome:
    profiles:
      - "dev"
      - "test"
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
    networks:
      - internal

networks:
  internal:
    driver: bridge

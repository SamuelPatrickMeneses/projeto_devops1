plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    //id 'application'
    id 'war'

    id 'io.openliberty.tools.gradle.Liberty' version '3.9.6'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral();
}

//sourceSets {
//    main {
//        resources {
//            srcDirs = ["src/main/webapp"]
//        }
//    }
//}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Jakarta REST Client implementation for integration tests
    testImplementation libs.jersey.client
    testImplementation libs.jersey.hk2
    testImplementation libs.jersey.media.jsonbinding

    // Selenium for acceptance testing
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.30.0'

    // This dependency is used by the application.
    implementation libs.guava

    implementation 'org.postgresql:postgresql:42.7.3'

    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0'

    runtimeOnly 'org.webjars:bootstrap:5.3.8'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

liberty {
    server {
        name = 'defaultServer'
        serverXmlFile = file('../server/server.xml')
        serverEnvFile = file('../example.env')
    }
}

tasks.register('copyExtraLib', Copy) {
    from '../server/postgresql-42.7.3.jar'
    into "${buildDir}/wlp/usr/servers/defaultServer/lib" 
}
tasks.named('libertyCreate') {
    finalizedBy 'copyExtraLib'
}


tasks.named('test') {
    //dependsOn 'libertyStart'
     
    finalizedBy 'libertyStop'

    useJUnitPlatform()

    testLogging {
        events "PASSED", "FAILED", "SKIPPED"
        showStandardStreams = true
        exceptionFormat = "full"
    }
}

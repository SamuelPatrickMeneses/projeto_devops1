<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova nota</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">Nova nota</h1>
        <div id="note" class="form-card">
            <div class="form-group">
                <label for="title">Título</label>
                <input type="text" id="title" placeholder="Digite o título">
            </div>
            <div class="form-group">
                <label for="content">Conteúdo</label>
                <textarea id="content" placeholder="Digite o conteúdo"></textarea>
            </div>
            <div class="form-actions">
                <button id="save-btn" class="btn btn-primary">Salvar</button>
                <a href="/" class="btn btn-outline">Cancelar</a>
            </div>
        </div>
        <a href="/" class="back-link">&larr; Voltar</a>
    </div>
    <script src="scripts/new.js"></script>
</body>
</html>
